services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: meterbill
      POSTGRES_PASSWORD: meterbill_secret
      POSTGRES_DB: meterbill
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/migrations:/docker-entrypoint-initdb.d
      # 18+ images keep data in /var/lib/postgresql/<major>/docker. Mounting the
      # old /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterbill"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: