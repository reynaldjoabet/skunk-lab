name: Scala CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes the older run. Runs on main are
# never cancelled, so every commit that lands there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  SBT_OPTS: -Xmx4g -XX:ReservedCodeCacheSize=512m

# Third-party actions are pinned to a full commit SHA, because a tag can be
# moved to different code after the fact. The trailing comment is the release
# the SHA belongs to; Dependabot (.github/dependabot.yml) keeps both current.

jobs:
  # Formatting is independent of Scala and JDK version, so it runs once here
  # rather than being repeated in every matrix leg.
  lint:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*.scala
            **/project/**/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Check formatting
        run: sbt -v "scalafmtSbtCheck; scalafmtCheckAll"

  build:
    name: Java ${{ matrix.java }} (${{ matrix.distribution }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
        distribution: [temurin, corretto, zulu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }} (${{ matrix.distribution }})
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*.scala
            **/project/**/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Compile and test
        run: sbt -v "Test/compile; test"

  # Builds the fat jar of every service, the artifact deploy/hetzner.sh ships.
  # Compiling alone does not catch a dependency bump that breaks the assembly
  # merge, so this fails the pull request instead of the next deploy.
  package:
    name: Package services
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            **/project/build.properties
            **/project/*.scala
            **/project/**/*.scala

      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Assemble service jars
        run: sbt -v "ledgerpay/assembly; meterbill/assembly; kudi/assembly; identity-management/assembly"

      - name: Verify service jars
        run: |
          set -euo pipefail
          for service in ledgerpay meterbill kudi identity-management; do
            jar=$(find target/out -type f -name "${service}.jar" -path "*/${service}/*" | head -n 1)
            if [[ -z "$jar" ]]; then
              echo "::error::No assembled jar found for ${service}"
              exit 1
            fi
            # A fat jar must carry a Main-Class entry, or `java -jar` cannot start it.
            if ! unzip -p "$jar" META-INF/MANIFEST.MF | grep -q '^Main-Class:'; then
              echo "::error::${jar} has no Main-Class in its manifest"
              exit 1
            fi
            echo "${service}: $(du -h "$jar" | cut -f1) ${jar}"
          done

  # Single status to mark as required in branch protection, so the rule does
  # not have to list every matrix leg and keeps working when the matrix changes.
  # `if: always()` matters: a skipped job counts as passing for a required
  # check, so without it a lint failure would let the pull request merge.
  ci-ok:
    name: CI result
    if: always()
    needs: [lint, build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
