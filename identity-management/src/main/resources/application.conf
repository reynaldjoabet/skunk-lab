app {

  db {
    # ── Writer (primary) ──────────────────────────────────────────────
    primary-host = "localhost"
    primary-host = ${?DB_PRIMARY_HOST}

    # ── Reader (replica) ──────────────────────────────────────────────
    replica-host = "localhost"
    replica-host = ${?DB_REPLICA_HOST}

    port = 5432
    port = ${?DB_PORT}

    user = "idmgmt"
    user = ${?DB_USER}

    # No default: startup fails if DB_PASSWORD is not set.
    password = ${?DB_PASSWORD}

    database = "idmgmt"
    database = ${?DB_NAME}

    # ── Pool sizing ───────────────────────────────────────────────────
    writer-pool-size = 25
    writer-pool-size = ${?DB_WRITER_POOL_SIZE}

    reader-pool-size = 50
    reader-pool-size = ${?DB_READER_POOL_SIZE}

    # ── Skunk-level timeouts ──────────────────────────────────────────
    writer-read-timeout = 5s
    reader-read-timeout = 3s

    # ── Postgres server-side timeouts (SET via connection parameters) ─
    writer-statement-timeout = 5000      # ms
    reader-statement-timeout = 3000      # ms
    idle-in-transaction-timeout = 10000  # ms
    lock-timeout = 2000                  # ms

    # ── TCP keepalive ─────────────────────────────────────────────────
    tcp-keepalives-idle = 60
    tcp-keepalives-interval = 10
    tcp-keepalives-count = 3

    # ── Security ──────────────────────────────────────────────────────
    ssl = "system"                       # system | trusted | none
    ssl = ${?DB_SSL}

    # ── Session parameters ────────────────────────────────────────────
    application-name = "idmgmt"
    application-name = ${?DB_APPLICATION_NAME}

    work-mem = "8MB"
    work-mem = ${?DB_WORK_MEM}

    # ── Skunk prepared statement caches ───────────────────────────────
    command-cache-size = 512
    query-cache-size = 512
    parse-cache-size = 512
  }

}
